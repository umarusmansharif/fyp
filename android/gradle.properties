# Gradle JVM memory (Reduced to prevent crashes on low RAM systems)
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.caching=true

# Kotlin compiler daemon (Reduced for stability)
kotlin.daemon.jvm.options=-Xmx1024m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC
kotlin.compiler.execution.strategy=out-of-process

# AndroidX
android.useAndroidX=true
android.enableJetifier=true

# Enable configuration cache for faster builds
org.gradle.configureondemand=true