# Gradle JVM memory (optimized - minimum working settings)
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=256m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.daemon=true

# Kotlin compiler daemon
kotlin.daemon.jvm.options=-Xmx512m -XX:MaxMetaspaceSize=128m -XX:+UseParallelGC
kotlin.compiler.execution.strategy=out-of-process

# AndroidX
android.useAndroidX=true
android.enableJetifier=true
